name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-and-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:harness

  e2e:
    runs-on: ubuntu-latest
    needs: unit-and-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --prefix example
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm run build
      - run: npm run build --prefix example
      - run: xvfb-run -a npx playwright test
        env:
          E2E: '1'
