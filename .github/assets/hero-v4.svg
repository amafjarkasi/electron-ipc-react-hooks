<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="electron-ipc-react-hooks">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#151b23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#61dafb"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="360" rx="12" fill="url(#bg)"/>

  <!-- Subtle top rule -->
  <rect x="0" y="0" width="1200" height="1" fill="#2a3441"/>

  <!-- Brand -->
  <text x="600" y="64" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="34" font-weight="650" letter-spacing="-0.6" fill="#e8eef4">
    electron-ipc-react-hooks
  </text>
  <text x="600" y="96" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="15" font-weight="450" fill="#8b9aab">
    Type-safe Electron IPC with React Query hooks
  </text>

  <!-- Accent underline -->
  <rect x="520" y="112" width="160" height="2" rx="1" fill="url(#accent)" opacity="0.85"/>

  <!-- Architecture row -->
  <!-- Main -->
  <g transform="translate(120, 150)">
    <rect width="280" height="140" rx="10" fill="#1a222d" stroke="#2d3a49" stroke-width="1"/>
    <text x="24" y="36"
          font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="12" font-weight="600" letter-spacing="1.2" fill="#4fc3f7">MAIN</text>
    <text x="24" y="68"
          font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, monospace"
          font-size="13" fill="#c5d0db">t.router({ & })</text>
    <text x="24" y="92"
          font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, monospace"
          font-size="13" fill="#6b7c8f">.query / .mutation</text>
    <text x="24" y="116"
          font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, monospace"
          font-size="13" fill="#6b7c8f">Zod · middleware</text>
  </g>

  <!-- Connector left -->
  <line x1="400" y1="220" x2="460" y2="220" stroke="#3d4f63" stroke-width="1.5"/>
  <circle cx="460" cy="220" r="3" fill="#4fc3f7"/>

  <!-- Preload -->
  <g transform="translate(460, 170)">
    <rect width="280" height="100" rx="10" fill="#1a222d" stroke="#2d3a49" stroke-width="1"/>
    <text x="140" y="36" text-anchor="middle"
          font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="12" font-weight="600" letter-spacing="1.2" fill="#8b9aab">PRELOAD</text>
    <text x="140" y="64" text-anchor="middle"
          font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, monospace"
          font-size="13" fill="#c5d0db">exposeIpc(&)</text>
    <text x="140" y="86" text-anchor="middle"
          font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="12" fill="#6b7c8f">contextBridge</text>
  </g>

  <!-- Connector right -->
  <circle cx="740" cy="220" r="3" fill="#61dafb"/>
  <line x1="740" y1="220" x2="800" y2="220" stroke="#3d4f63" stroke-width="1.5"/>

  <!-- Renderer -->
  <g transform="translate(800, 150)">
    <rect width="280" height="140" rx="10" fill="#1a222d" stroke="#2d3a49" stroke-width="1"/>
    <text x="24" y="36"
          font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="12" font-weight="600" letter-spacing="1.2" fill="#61dafb">RENDERER</text>
    <text x="24" y="68"
          font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, monospace"
          font-size="13" fill="#c5d0db">ipc.getUser.useQuery()</text>
    <text x="24" y="92"
          font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, monospace"
          font-size="13" fill="#6b7c8f">useMutation · useChannel</text>
    <text x="24" y="116"
          font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, monospace"
          font-size="13" fill="#6b7c8f">TanStack Query</text>
  </g>

  <!-- Footer meta -->
  <text x="600" y="332" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="12" font-weight="500" fill="#5a6b7d">
    End-to-end types · No codegen · React Query native
  </text>
</svg>
